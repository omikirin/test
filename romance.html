<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Romance Simulation</title>
  <style>
    body { font-family: Arial, sans-serif; }
    #chat-box {
      width: 100%;
      height: 300px;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-y: scroll;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Romance Simulation Demo</h1>
  <div>
    <label for="char-name">Character Name:</label>
    <input type="text" id="char-name" placeholder="e.g. Alex" />
    <button onclick="startConversation()">Start</button>
  </div>
  <div id="chat-box"></div>
  <p>Affection: <span id="affection">0</span></p>
  <div id="choices" style="margin-bottom:10px;"></div>
  <input type="text" id="user-input" placeholder="Say something..." disabled />
  <button id="send-btn" onclick="sendMessage()" disabled>Send</button>

  <script src="romance.js"></script>
</body>
</html>
